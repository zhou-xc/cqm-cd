name: MetroMinutes
options:
  bundleIdPrefix: cn.personal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    METRO_APP_GROUP: group.cn.personal.metrominutes
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  MetroMinutes:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: Resources
        buildPhase: resources
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: 到站
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [metrominutes]
        MetroAppGroup: $(METRO_APP_GROUP)
    entitlements:
      path: Config/App.entitlements
      properties:
        com.apple.security.application-groups: [$(METRO_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.personal.metrominutes
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: MetroMinutesWidget
        embed: true
  MetroMinutesWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
      - path: Resources/stations.json
        buildPhase: resources
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: 到站
        MetroAppGroup: $(METRO_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/Widget.entitlements
      properties:
        com.apple.security.application-groups: [$(METRO_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.personal.metrominutes.widget
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  MetroMinutesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: MetroMinutes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.personal.metrominutes.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MetroMinutes:
    build:
      targets:
        MetroMinutes: all
        MetroMinutesWidget: all
    test:
      targets: [MetroMinutesTests]
